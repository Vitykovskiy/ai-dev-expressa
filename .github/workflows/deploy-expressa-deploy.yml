name: Deploy Expressa Deploy

on:
  push:
    branches:
      - deploy

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-expressa-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    name: build-images
    runs-on: ubuntu-latest
    environment: expressa-deploy
    outputs:
      backend_image: ${{ steps.image-names.outputs.backend_image }}
      frontend_image: ${{ steps.image-names.outputs.frontend_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Prepare image names
        id: image-names
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "backend_image=${{ env.REGISTRY }}/${owner}/${repository}-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${{ env.REGISTRY }}/${owner}/${repository}-frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.image-names.outputs.backend_image }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.image-names.outputs.frontend_image }}

  deploy-expressa-deploy-stand:
    name: deploy-expressa-deploy-stand
    runs-on: ubuntu-latest
    environment: expressa-deploy
    needs:
      - build-images
    steps:
      - name: Deploy expressa-deploy stand and run smoke-check
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.EXPRESSA_DEPLOY_VPS_APP_DIR }}
          ENV_FILE: ${{ secrets.EXPRESSA_DEPLOY_VPS_ENV_FILE }}
          DEPLOY_COMPOSE_FILE: docker-compose.deploy.yml
          DEPLOY_PROJECT_NAME: expressa-deploy
          DEPLOY_STAND_SLUG: expressa-deploy
          DEPLOY_BACKEND_IMAGE: ${{ needs.build-images.outputs.backend_image }}
          DEPLOY_FRONTEND_IMAGE: ${{ needs.build-images.outputs.frontend_image }}
          DEPLOY_REGISTRY: ${{ env.REGISTRY }}
          DEPLOY_REGISTRY_USERNAME: ${{ secrets.EXPRESSA_DEPLOY_REGISTRY_USERNAME }}
          DEPLOY_REGISTRY_PASSWORD: ${{ secrets.EXPRESSA_DEPLOY_REGISTRY_PASSWORD }}
          TEST_DEPLOY_HOST_BACKEND_PORT: ${{ vars.EXPRESSA_DEPLOY_HOST_BACKEND_PORT }}
          TEST_DEPLOY_HOST_FRONTEND_PORT: ${{ vars.EXPRESSA_DEPLOY_HOST_FRONTEND_PORT }}
          SMOKE_FRONTEND_BASE_URL: https://expressa-deploy.vitykovskiy.ru
        with:
          host: ${{ secrets.EXPRESSA_DEPLOY_VPS_HOST }}
          username: ${{ secrets.EXPRESSA_DEPLOY_VPS_USER }}
          key: ${{ secrets.EXPRESSA_DEPLOY_VPS_SSH_KEY }}
          port: ${{ secrets.EXPRESSA_DEPLOY_VPS_PORT }}
          fingerprint: ${{ secrets.EXPRESSA_DEPLOY_VPS_HOST_FINGERPRINT }}
          script_stop: true
          envs: APP_DIR,ENV_FILE,DEPLOY_COMPOSE_FILE,DEPLOY_PROJECT_NAME,DEPLOY_STAND_SLUG,DEPLOY_BACKEND_IMAGE,DEPLOY_FRONTEND_IMAGE,DEPLOY_REGISTRY,DEPLOY_REGISTRY_USERNAME,DEPLOY_REGISTRY_PASSWORD,TEST_DEPLOY_HOST_BACKEND_PORT,TEST_DEPLOY_HOST_FRONTEND_PORT,SMOKE_FRONTEND_BASE_URL
          script: |
            set -euo pipefail
            if [ -z "${APP_DIR}" ] || [ -z "${ENV_FILE}" ] || [ -z "${DEPLOY_PROJECT_NAME}" ] || [ -z "${DEPLOY_BACKEND_IMAGE}" ] || [ -z "${DEPLOY_FRONTEND_IMAGE}" ] || [ -z "${TEST_DEPLOY_HOST_BACKEND_PORT}" ] || [ -z "${TEST_DEPLOY_HOST_FRONTEND_PORT}" ] || [ -z "${SMOKE_FRONTEND_BASE_URL}" ]; then
              echo "Required expressa-deploy deploy contract values are missing."
              exit 1
            fi

            cd "${APP_DIR}"
            git fetch --prune origin
            git checkout --force -B deploy origin/deploy
            git reset --hard origin/deploy
            chmod +x scripts/deploy-test-vps.sh
            SKIP_GIT_PULL=true ./scripts/deploy-test-vps.sh
